# Benchmarks for the mod's hot paths. `yog build` generates a cdylib-only
# crate, which benches can't link against, so this crate builds the same
# `src/` as a plain library. `generated` links to `.yog-build/generated`:
# run `yog build` (or `yog check`) once first.
#
#     cargo bench --manifest-path benches/Cargo.toml
[package]
name = "hexcasting-bench"
version = "0.0.0"
edition = "2024"
publish = false
autobenches = false

[lib]
name = "hexcasting"
path = "../src/lib.rs"

# Same as the generated crate's [dependencies].
[dependencies]
yog-api = "0.92.2"
rkyv = "0.8"
yog-kit = "0.3"
uuid = "1.23.3"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "casting"
harness = false

[workspace]
