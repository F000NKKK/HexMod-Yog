[mod]
id          = "hexcasting"
name        = "@Strings.mod_name"
version     = "0.1.0"
edition     = "2024"
description = "@Strings.mod_description"
authors     = ["F000NK", "Yog Team", "gamma-delta (original Hex Casting)", "FallingColors & HexMod contributors (original Hex Casting)"]
license     = "MIT"

[dependencies]
yog-api = "0.98"
yog-kit = "0.9"
uuid = "1.23.3"

## `yog run <name>` — build, drop the .yog into the loader's own Gradle dev-run
# instance, then launch it.
[run."forge-1.21.1"]
name       = "Forge 1.21.1"
export_dir = "../Yog-Mod-Loader/forge/run/yog-mods"
command    = "./gradlew"
args       = ["runClient", "-Pminecraft_version=1.21.1"]
cwd        = "../Yog-Mod-Loader/forge"
env        = [
    "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64",
    "__NV_PRIME_RENDER_OFFLOAD=1",
    "__GLX_VENDOR_LIBRARY_NAME=nvidia",
    "__VK_LAYER_NV_optimus=NVIDIA_only",
]

